name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Verify release candidate
        run: ./gradlew clean check build --no-daemon --stacktrace

      - name: Update release pull request or create release
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Validate release version and create checksum
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          project_version="$(./gradlew -q printVersion)"
          if [[ "$project_version" != "$RELEASE_VERSION" ]]; then
            echo "Gradle version $project_version does not match release version $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$project_version" ]]; then
            echo "Tag $RELEASE_TAG does not match expected tag v$project_version" >&2
            exit 1
          fi
          jar_path="build/libs/EssentialsCore-$project_version.jar"
          if [[ ! -f "$jar_path" ]]; then
            echo "Release artifact $jar_path was not produced" >&2
            exit 1
          fi
          jar_name="$(basename "$jar_path")"
          (cd build/libs && sha256sum "$jar_name" > "$jar_name.sha256")
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$jar_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload assets to GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          JAR_PATH: ${{ steps.artifact.outputs.jar_path }}
          CHECKSUM_PATH: ${{ steps.artifact.outputs.checksum_path }}
        run: gh release upload "$RELEASE_TAG" "$JAR_PATH" "$CHECKSUM_PATH" --clobber
