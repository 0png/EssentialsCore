name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Build and run tests
        run: ./gradlew clean check build --no-daemon --stacktrace

      - name: Prepare verified artifact
        id: artifact
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'EssentialsCore-*.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one EssentialsCore JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          jar_path="${jars[0]}"
          jar_name="$(basename "$jar_path")"
          (cd build/libs && sha256sum "$jar_name" > "$jar_name.sha256")
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$jar_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: EssentialsCore-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.jar_path }}
            ${{ steps.artifact.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report-${{ github.sha }}
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
