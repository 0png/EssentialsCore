version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    labels: [dependencies, ci]
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-dependencies:
        patterns: ["*"]
